name: Reusable Android Build Workflow

on:
  workflow_call:
    inputs:
      build_variant:
        description: 'Build variant (debug or release)'
        required: false
        type: string
        default: 'debug'
      run_tests:
        description: 'Whether to run unit tests'
        required: false
        type: boolean
        default: false

jobs:
  unit-test:
    name: Unit tests and setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            androidApp/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run unit tests (conditional)
        if: ${{ inputs.run_tests }}
        run: |
          VAR='${{ inputs.build_variant }}'
          VAR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${VAR:0:1})${VAR:1}"
          echo "Running unit tests for variant: $VAR_CAP"
          ./gradlew --no-daemon :androidApp:test${VAR_CAP}UnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-reports
          path: androidApp/build/reports/tests/**

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            androidApp/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run Android Lint
        run: |
          VAR='${{ inputs.build_variant }}'
          VAR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${VAR:0:1})${VAR:1}"
          ./gradlew --no-daemon :androidApp:lint${VAR_CAP}
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-*.html

  build-aab:
    name: Build AAB
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            androidApp/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build AAB
        run: |
          VAR='${{ inputs.build_variant }}'
          VAR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${VAR:0:1})${VAR:1}"
          ./gradlew --no-daemon :androidApp:bundle${VAR_CAP}
      - name: Upload AAB Artifact
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: aab-artifact
          path: androidApp/build/outputs/bundle/**/**/*.aab

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            androidApp/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build APK
        run: |
          VAR='${{ inputs.build_variant }}'
          VAR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${VAR:0:1})${VAR:1}"
          ./gradlew --no-daemon :androidApp:assemble${VAR_CAP}
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: apk-artifact
          path: androidApp/build/outputs/apk/**/**/*.apk