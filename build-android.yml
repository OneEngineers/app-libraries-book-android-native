workflows:
  android-build:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - keystore_reference
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your-email@assistant.com
        notify:
          success: true
          failure: true

android_signing:
  keystore_reference:
    path: keystore.jks
    password: EncryptedKeystorePassword
    key_alias: your-key-alias
    key_password: EncryptedKeyPassword